<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Casio Style Calculator</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9e9e9;font-family:Arial,sans-serif;display:flex;justify-content:center;min-height:100vh}
.calc{width:min(390px,100%);padding:14px;background:#202020}
.display{background:#c8d3b4;border:5px solid #555;border-radius:8px;padding:12px 10px;margin-bottom:12px;box-shadow:inset 0 2px 5px #777}
.expr{height:25px;text-align:right;font-size:16px;color:#37402f;overflow:hidden}
.result{height:50px;text-align:right;font:32px monospace;color:#10160e;overflow:hidden}
.mode{font-size:11px;color:#333;min-height:14px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
button{height:58px;border:0;border-radius:8px;background:#444;color:white;font-size:20px;font-weight:bold;box-shadow:0 3px 0 #171717;touch-action:manipulation}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #171717}
.fn{background:#606060;font-size:16px}.op{background:#765b35}.danger{background:#7b3333}.eq{background:#315d3a}
@media(max-width:350px){button{height:52px;font-size:18px}.result{font-size:28px}}
</style>
</head>
<body>
<div class="calc">
  <div class="display">
    <div class="mode" id="mode">DEG</div>
    <div class="expr" id="expr"></div>
    <div class="result" id="result">0</div>
  </div>
  <div class="keys">
    <button class="fn" data-action="mode">DEG/RAD</button>
    <button class="fn" data-action="sqrt">√</button>
    <button class="fn" data-action="square">x²</button>
    <button class="danger" data-action="clear">AC</button>

    <button class="fn" data-action="sin">sin</button>
    <button class="fn" data-action="cos">cos</button>
    <button class="fn" data-action="tan">tan</button>
    <button class="op" data-value="/">÷</button>

    <button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button>
    <button class="op" data-value="*">×</button>

    <button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button>
    <button class="op" data-value="-">−</button>

    <button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button>
    <button class="op" data-value="+">+</button>

    <button data-value="0">0</button><button data-value=".">.</button>
    <button class="fn" data-action="back">⌫</button><button class="eq" data-action="equals">=</button>
  </div>
</div>
<script>
const exprEl=document.getElementById('expr'), resultEl=document.getElementById('result'), modeEl=document.getElementById('mode');
let expr='', last='', rad=false;
function render(){exprEl.textContent=expr||'';resultEl.textContent=last||expr||'0';modeEl.textContent=rad?'RAD':'DEG'}
function safeEval(s){
  if(!/^[0-9+\-*/().\s]+$/.test(s)) throw Error();
  if(!s.trim()) return 0;
  return Function('"use strict";return ('+s+')')();
}
function format(n){return Number.isFinite(n)?String(Number(n.toPrecision(12))):'Error'}
function calculate(){
  try{last=format(safeEval(expr));expr=last==='Error'?'':last}catch(e){last='Error'}
  render();
}
document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
 const v=b.dataset.value,a=b.dataset.action;
 if(v!==undefined){expr+=v;last='';render();return}
 if(a==='clear'){expr='';last='';render()}
 else if(a==='back'){expr=expr.slice(0,-1);last='';render()}
 else if(a==='equals')calculate();
 else if(a==='mode'){rad=!rad;render()}
 else if(['sqrt','square','sin','cos','tan'].includes(a)){
   try{
    let n=safeEval(expr||last||'0'), x=n;
    if(a==='sqrt') x=Math.sqrt(n);
    if(a==='square') x=n*n;
    if(a==='sin') x=Math.sin(rad?n:n*Math.PI/180);
    if(a==='cos') x=Math.cos(rad?n:n*Math.PI/180);
    if(a==='tan') x=Math.tan(rad?n:n*Math.PI/180);
    last=format(x);expr=last==='Error'?'':last;render();
   }catch(e){last='Error';render()}
 }
}));
document.addEventListener('keydown',e=>{
 if(!document.querySelector('.calc'))return;
 if(/[0-9.+\-*/()]/.test(e.key)){expr+=e.key;last='';render()}
 else if(e.key==='Enter'||e.key==='=')calculate();
 else if(e.key==='Backspace'){expr=expr.slice(0,-1);last='';render()}
 else if(e.key==='Escape'){expr='';last='';render()}
});
render();
</script>
</body>
</html>
